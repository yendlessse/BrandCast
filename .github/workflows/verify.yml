# 구현과 검증 역할 분리에 따른 PR 머지 게이트.
#
# 두 가지를 확인한다.
#   1. 규칙 자동 검사 — 파일만 읽어 판정할 수 있는 AGENTS.md 규칙
#   2. 검증 통과 라벨 확인 — 검증 에이전트가 실행·대조 검증을 마쳤다는 기록
#
# 새 커밋이 올라오면 이전 검증은 무효가 되므로 `검증-통과` 라벨을 자동으로 제거한다.
name: 검증

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  rules:
    name: 규칙 자동 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 저장소 규칙 검사
        run: python .github/scripts/check_rules.py

  invalidate_label:
    name: 새 커밋 시 검증 라벨 무효화
    runs-on: ubuntu-latest
    steps:
      - name: 새 커밋이면 검증-통과 라벨 제거
        if: github.event.action == 'synchronize'
        uses: actions/github-script@v7
        with:
          script: |
            // 새 커밋은 이전 검증 결과를 무효화한다. 라벨이 없으면 404이므로 무시한다.
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: '검증-통과',
              });
              core.notice('새 커밋이 올라와 검증-통과 라벨을 제거했습니다. 재검증이 필요합니다.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('검증-통과 라벨이 없어 제거할 것이 없습니다.');
            }

  verify_label:
    name: 검증 통과 라벨 확인
    runs-on: ubuntu-latest
    needs: invalidate_label
    steps:
      - name: 현재 라벨 확인
        uses: actions/github-script@v7
        with:
          script: |
            // 이벤트 payload의 라벨은 라벨무효화 작업 이전 상태일 수 있으므로 API로 현재 값을 다시 읽는다.
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const names = labels.map((label) => label.name);
            core.info(`현재 라벨: ${names.join(', ') || '없음'}`);
            if (names.includes('검증-반송')) {
              core.setFailed('검증-반송 라벨이 있습니다. 검증에서 지적된 항목을 먼저 해결하십시오.');
              return;
            }
            if (!names.includes('검증-통과')) {
              core.setFailed('검증-통과 라벨이 없습니다. 검증 에이전트의 검증을 통과한 뒤 머지하십시오.');
              return;
            }
            core.notice('검증-통과 라벨을 확인했습니다.');
